<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - NutriFit</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>
<nav class="navSuperior">
    <span class="logo">NutriFit</span>
    <ul>
        <li>
            <a th:href="@{/dashboard}">Dashboard</a>
        </li>
    </ul>
</nav>

<main class="auth-main">
    <div class="form-container">
        <form th:action="@{/login}" method="post">
            <div class="form-title">
                <h1>Entrar</h1>
                <p>Acesse o sistema NutriFit</p>
            </div>

            <div th:if="${param.fail}" class="alert alert-error">
                <span>E-mail ou senha incorretos.</span>
            </div>

            <div th:if="${param.logout}" class="alert alert-success">
                <span>Logout realizado com sucesso.</span>
            </div>

            <div class="form-group">
                <label for="username">E-mail</label>
                <input type="email" id="username" name="username" class="form-input"
                       placeholder="Digite seu e-mail" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" class="form-input"
                       placeholder="Digite sua senha" required autocomplete="current-password">
            </div>

            <div class="form-actions">
                <button type="submit">Entrar</button>
            </div>

            <p style="margin-top: 12px;">
                Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a>
            </p>
        </form>
    </div>
</main>

</body>

</html>
