<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Detalhes do Treino - NutriFit</title>
</head>
<body>
<main class="page-content">
    <section class="details-container">
        <h1 th:text="${treino.nome}">Nome do treino</h1>

        <p><strong>Tipo:</strong> <span th:text="${treino.tipoTreino}">Tipo</span></p>
        <p><strong>Nível:</strong> <span th:text="${treino.nivel}">Nível</span></p>
        <p><strong>Duração:</strong> <span th:text="${treino.duracaoMinutos}">0</span> minutos</p>
        <p><strong>Frequência semanal:</strong> <span th:text="${treino.frequenciaSemanal}">0</span>x por semana</p>
        <p><strong>Descrição:</strong></p>
        <p th:text="${treino.descricao}">Descrição</p>

        <div class="form-actions">
            <a th:href="@{/treinos/editar/{id}(id=${treino.id})}">Editar</a>
            <a th:href="@{/treinos}">Voltar</a>
        </div>
    </section>
</main>
</body>
</html>
