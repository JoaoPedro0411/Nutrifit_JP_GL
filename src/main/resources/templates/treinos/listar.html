<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::main})}">
<head>
    <title>Treinos - NutriFit</title>
</head>
<body>
<main class="page-content">
    <section class="list-container">
        <div class="form-title">
            <h1>Treinos</h1>
            <p>Cadastre e acompanhe os treinos personalizados.</p>
        </div>

        <div class="dashboard-action">
            <a th:href="@{/treinos/novo}">Novo Treino</a>
        </div>

        <div th:if="${#lists.isEmpty(treinos)}" class="empty-message">
            Nenhum treino cadastrado até o momento.
        </div>

        <table th:if="${!#lists.isEmpty(treinos)}">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Tipo</th>
                <th>Nível</th>
                <th>Duração</th>
                <th>Frequência semanal</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="treino : ${treinos}">
                <td th:text="${treino.nome}">Nome</td>
                <td th:text="${treino.tipoTreino}">Tipo</td>
                <td th:text="${treino.nivel}">Nível</td>
                <td><span th:text="${treino.duracaoMinutos}">0</span> min</td>
                <td><span th:text="${treino.frequenciaSemanal}">0</span>x por semana</td>
                <td class="table-actions">
                    <a th:href="@{/treinos/detalhes/{id}(id=${treino.id})}">Detalhes</a>
                    <a th:href="@{/treinos/editar/{id}(id=${treino.id})}">Editar</a>
                    <form th:action="@{/treinos/excluir/{id}(id=${treino.id})}" method="post">
                        <button type="submit" onclick="return confirm('Deseja excluir este treino?')">Excluir</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
