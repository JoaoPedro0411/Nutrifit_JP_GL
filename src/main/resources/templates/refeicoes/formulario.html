<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Refeição</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="page-content">
    <section class="form-container">
        <div class="form-title">
            <h1 th:text="${refeicao.id == null} ? 'Nova Refeição' : 'Editar Refeição'"></h1>
        </div>

        <form th:action="@{/refeicoes/salvar}" th:object="${refeicao}" method="post">
            <input type="hidden" th:field="*{id}">

            <div>
                <label>Nome</label>
                <input type="text" th:field="*{nome}" required maxlength="80">
            </div>

            <div>
                <label>Descrição</label>
                <textarea th:field="*{descricao}" maxlength="500"></textarea>
            </div>

            <div>
                <label>Tipo</label>
                <select th:field="*{tipoRefeicao}" required>
                    <option th:each="t : ${T(br.edu.nutrifit.model.enums.ETipoRefeicao).values()}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>

            <div>
                <label>Calorias</label>
                <input type="number" th:field="*{calorias}" min="0" required>
            </div>

            <div>
                <label>Proteínas (g)</label>
                <input type="number" step="0.1" th:field="*{proteinas}" min="0" required>
            </div>

            <div>
                <label>Carboidratos (g)</label>
                <input type="number" step="0.1" th:field="*{carboidratos}" min="0" required>
            </div>

            <div>
                <label>Gorduras (g)</label>
                <input type="number" step="0.1" th:field="*{gorduras}" min="0" required>
            </div>

            <div class="form-actions">
                <button type="submit">Salvar</button>
                <a th:href="@{/refeicoes}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
